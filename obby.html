<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Obby Parkour</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#87ceeb;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{display:block;margin:0 auto}
#ui{position:fixed;top:10px;left:10px;font-size:18px;font-weight:700;text-shadow:2px 2px 4px #000;z-index:5}
#over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:10}
#over h1{font-size:48px;margin-bottom:10px}
#over p{font-size:22px;margin-bottom:20px}
#over button{padding:14px 36px;font-size:20px;border:none;border-radius:12px;background:#4caf50;color:#fff;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div id="ui">Stage: 1 &nbsp; Checkpoint: 0</div>
<canvas id="c"></canvas>
<div id="over"><h1>Fell!</h1><p id="final"></p><button id="restart">Respawn</button></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}resize();addEventListener('resize',resize);
// 3D-ish: platforms in world space; camera follows player
let player={x:0,y:0,z:0,vx:0,vy:0,vz:0,onGround:false};
let platforms=[],checkpoints=[],stage=1,checkpoint=0,running=true;
function buildStage(s){
 platforms=[];checkpoints=[];
 // ground start
 platforms.push({x:-2,y:-1,z:-2,w:4,h:1,d:4,color:'#7cfc00'});
 // floating platforms
 let z=2;
 for(let i=0;i<12+ s*3;i++){
   const x=(Math.random()*6-3);
   const y=-(Math.random()*2+0.5*i*0.3);
   const w=1.2+Math.random()*1.5;
   platforms.push({x,y,z,w,h:0.6,d:w,color: i%3===0?'#ff9800':'#4caf50'});
   if(i%4===0) checkpoints.push({x,y+0.7,z,w:1});
   z+=1.5+Math.random()*1.5;
 }
 // final platform
 platforms.push({x:0,y:-(4+s),z:z,w:3,h:0.6,d:3,color:'#ffd700'});
 checkpoints.push({x:0,y:-(3.5+s),z:z,w:2});
}
buildStage(1);
function reset(){player={x:0,y:0,z:0,vx:0,vy:0,vz:0,onGround:false};stage=1;checkpoint=0;running=true;buildStage(1);document.getElementById('over').style.display='none';updateUI();}
function respawn(){const cp=checkpoints[checkpoint];player.x=cp?cp.x:0;player.y=cp?cp.y:0;player.z=cp?cp.z:0;player.vx=player.vy=player.vz=0;running=true;document.getElementById('over').style.display='none';}
function updateUI(){document.getElementById('ui').innerHTML='Stage: '+stage+' &nbsp; Checkpoint: '+checkpoint;}
addEventListener('keydown',e=>{
 if(!running)return;
 if(e.key==='a'||e.key==='ArrowLeft')player.vx=-0.15;
 if(e.key==='d'||e.key==='ArrowRight')player.vx=0.15;
 if(e.key==='w'||e.key==='ArrowUp')player.vz=0.2;
 if(e.key==='s'||e.key==='ArrowDown')player.vz=-0.2;
 if(e.key===' '||e.key==='ArrowUp'){if(player.onGround){player.vy=0.25;player.onGround=false;}}
});
addEventListener('keyup',e=>{
 if(e.key==='a'||e.key==='d'||e.key==='ArrowLeft'||e.key==='ArrowRight')player.vx=0;
 if(e.key==='w'||e.key==='s'||e.key==='ArrowUp'||e.key==='ArrowDown')player.vz=0;
});
let touchStart=null;
c.addEventListener('touchstart',e=>{const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY};},{passive:true});
c.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0];const dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.abs(dx)>Math.abs(dy)){if(dx<-30)player.vx=-0.15;else if(dx>30)player.vx=0.15;}else{if(dy<-30){if(player.onGround){player.vy=0.25;player.onGround=false;}}else if(dy>30)player.vz=-0.2;}setTimeout(()=>{player.vx=0;player.vz=0;},200);touchStart=null;},{passive:true});
document.getElementById('restart').onclick=respawn;
function update(){
 if(!running)return;
 // gravity
 player.vy-=0.012;
 player.x+=player.vx;player.y+=player.vy;player.z+=player.vz;
 // platform collision
 player.onGround=false;
 platforms.forEach(p=>{
   if(player.x>p.x-p.w/2 && player.x<p.x+p.w/2 && player.z>p.z-p.d/2 && player.z<p.z+p.d/2){
     const top=p.y+p.h;
     if(player.y>=top-0.05 && player.y<=top+0.15 && player.vy<=0){player.y=top;player.vy=0;player.onGround=true;}
   }
 });
 // checkpoint
 checkpoints.forEach((cp,i)=>{if(i>checkpoint && Math.abs(player.x-cp.x)<cp.w/2 && Math.abs(player.z-cp.z)<cp.w/2 && Math.abs(player.y-cp.y)<1){checkpoint=i;updateUI();}});
 // fall
 if(player.y<-15){running=false;document.getElementById('over').style.display='flex';document.getElementById('final').textContent='Stage '+stage+' Checkpoint '+checkpoint;return;}
 // finish stage
 const last=platforms[platforms.length-1];
 if(Math.abs(player.x-last.x)<last.w/2 && Math.abs(player.z-last.z)<last.d/2 && player.y>last.y){
   stage++;checkpoint=0;buildStage(stage);player.x=0;player.y=0;player.z=0;player.vx=player.vy=player.vz=0;updateUI();
 }
}
// projection
function proj(x,y,z){const camZ=player.z-8;const scale=200/(z-camZ+200);const sx=W/2+(x-player.x)*scale*80;const sy=H/2-(y-player.y)*scale*80 - (z-player.z)*scale*40;return {x:sx,y:sy,s:scale};}
function draw(){
 ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,W,H);
 // sort platforms by z
 const sorted=[...platforms].sort((a,b)=>b.z-a.z);
 sorted.forEach(p=>{
   const corners=[[-p.w/2,-p.h/2,-p.d/2],[p.w/2,-p.h/2,-p.d/2],[p.w/2,-p.h/2,p.d/2],[-p.w/2,-p.h/2,p.d/2],[-p.w/2,p.h/2,-p.d/2],[p.w/2,p.h/2,-p.d/2],[p.w/2,p.h/2,p.d/2],[-p.w/2,p.h/2,p.d/2]];
   const pts=corners.map(([dx,dy,dz])=>proj(p.x+dx,p.y+dy,p.z+dz));
   // top face
   ctx.fillStyle=p.color;
   ctx.beginPath();
   [0,1,2,3].forEach((i,j)=>{const pt=pts[i];if(j===0)ctx.moveTo(pt.x,pt.y);else ctx.lineTo(pt.x,pt.y);});
   ctx.closePath();ctx.fill();
   // front face
   ctx.fillStyle='rgba(0,0,0,.15)';
   ctx.beginPath();
   [1,2,6,5].forEach((i,j)=>{const pt=pts[i];if(j===0)ctx.moveTo(pt.x,pt.y);else ctx.lineTo(pt.x,pt.y);});
   ctx.closePath();ctx.fill();
 });
 // checkpoints
 checkpoints.forEach((cp,i)=>{
   if(i<=checkpoint)return;
   const pt=proj(cp.x,cp.y,cp.z);
   ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(pt.x,pt.y,8*pt.s,0,Math.PI*2);ctx.fill();
 });
 // player
 const pp=proj(player.x,player.y,player.z);
 ctx.fillStyle='#2196f3';ctx.beginPath();ctx.arc(pp.x,pp.y,12*pp.s,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('🧍',pp.x,pp.y+5);
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
